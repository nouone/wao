extends: ./electron-builder.yml
productName: Lumina Chat
# Display identity is Lumina Chat; the appId, profile directory and repo stay
# "wao" so the NSIS install GUID, the %APPDATA%\Wao profile and existing
# pairing/API wiring keep working across the rename.
appId: local.wao
publish: null
extraMetadata:
  author:
    name: Wao Contributors
    email: 4097153+nouone@users.noreply.github.com
    url: https://github.com/nouone
compression: store
nsis:
  shortcutName: Lumina Chat
  uninstallDisplayName: Lumina Chat

win:
  artifactName: LuminaChat-${version}-${arch}-Setup.${ext}
